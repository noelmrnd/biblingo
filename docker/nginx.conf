# Landing Page Web (biblingo.me)
server {
    listen 80;
    server_name biblingo.me www.biblingo.me;
    root /var/www/web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Frontend App SPA (app.biblingo.me) & Default Server
server {
    listen 80 default_server;
    server_name localhost app.biblingo.me;
    root /var/www/app/dist;
    index index.html;

    # Compresión Gzip para alto rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Universal Links (iOS) y App Links (Android)
    location /.well-known/apple-app-site-association {
        alias /var/www/app/dist/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    location /.well-known/assetlinks.json {
        alias /var/www/app/dist/.well-known/assetlinks.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy para el Backend API PHP 8.3 FPM
    location /api {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
    }

    # Enrutamiento SPA Vue.js
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
