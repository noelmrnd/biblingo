user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Puerto 8082: Landing Page Web (biblingo.me)
    server {
        listen 8082;
        server_name _;
        root /var/www/web;
        index index.html;

        # index.html no debe cachearse: si no, un deploy nuevo puede tardar en
        # llegarle al usuario porque el navegador (o un proxy intermedio) sirve
        # la version vieja desde cache en vez de pedirla de nuevo.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            etag off;
        }

        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            etag off;
            try_files $uri $uri.html $uri/ /index.html;
        }
    }

    # 2. Puerto 8083: Frontend App SPA (app.biblingo.me)
    server {
        listen 8083;
        server_name _;
        root /var/www/app;
        index index.html;

        location /.well-known/apple-app-site-association {
            alias /var/www/app/.well-known/apple-app-site-association;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        location /.well-known/assetlinks.json {
            alias /var/www/app/.well-known/assetlinks.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        # index.html no debe cachearse (ver comentario equivalente en el server 8082):
        # con el SPA router, TODA ruta cae aca via try_files, asi que esto cubre
        # tanto /index.html directo como cualquier otra ruta de la app.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            etag off;
        }

        # No hay service worker todavia (no es PWA, es Capacitor nativo), pero
        # si se agrega (vite-plugin-pwa u otro) el archivo del SW tampoco debe
        # cachearse, por la misma razon que index.html: si no, un usuario puede
        # quedar atado a un SW viejo que nunca se actualiza.
        location ~* ^/(service-worker|sw)\.js$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            etag off;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            expires off;
            etag off;
            try_files $uri $uri/ /index.html;
        }
    }

    # 3. Puerto 8084: Backend API PHP 8.3 FPM
    server {
        listen 8084;
        server_name _;
        root /var/www/api/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # nginx no reenvia este header a PHP-FPM por defecto; lo necesita el
            # middleware de auth para leer "Authorization: Bearer <token>"
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        }
    }
}
