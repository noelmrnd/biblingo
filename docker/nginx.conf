user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Puerto 8082: Landing Page Web (biblingo.me)
    server {
        listen 8082;
        server_name _;
        root /var/www/web;
        index index.html;

        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }

    # 2. Puerto 8083: Frontend App SPA (app.biblingo.me)
    server {
        listen 8083;
        server_name _;
        root /var/www/app;
        index index.html;

        location /.well-known/apple-app-site-association {
            alias /var/www/app/.well-known/apple-app-site-association;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        location /.well-known/assetlinks.json {
            alias /var/www/app/.well-known/assetlinks.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 3. Puerto 8084: Backend API PHP 8.3 FPM
    server {
        listen 8084;
        server_name _;
        root /var/www/api/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
