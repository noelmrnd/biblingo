user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # El trafico llega via Cloudflare: sin esto, $remote_addr (y por lo tanto
    # $_SERVER['REMOTE_ADDR'] en PHP, usado por Utils/RateLimiter) seria la IP del
    # edge de Cloudflare, la misma para todos los clientes. Con real_ip_header,
    # nginx toma la IP real del cliente de CF-Connecting-IP, pero SOLO si la
    # conexion TCP entrante viene de un rango de IPs de Cloudflare (si no,
    # cualquiera podria falsificar ese header conectandose directo al origin).
    # Ranges de https://www.cloudflare.com/ips/ — revisar periodicamente por si
    # Cloudflare agrega/retira rangos.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 1. Puerto 8082: Landing Page Web (biblingo.me)
    server {
        listen 8082;
        server_name _;
        root /var/www/web;
        index index.html;

        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }

    # 2. Puerto 8083: Frontend App SPA (app.biblingo.me)
    server {
        listen 8083;
        server_name _;
        root /var/www/app;
        index index.html;

        location /.well-known/apple-app-site-association {
            alias /var/www/app/.well-known/apple-app-site-association;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        location /.well-known/assetlinks.json {
            alias /var/www/app/.well-known/assetlinks.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 3. Puerto 8084: Backend API PHP 8.3 FPM
    server {
        listen 8084;
        server_name _;
        root /var/www/api/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # nginx no reenvia este header a PHP-FPM por defecto; lo necesita el
            # middleware de auth para leer "Authorization: Bearer <token>"
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        }
    }
}
