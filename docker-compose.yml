services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: biblingo_web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/var/www/web:ro
      - ./app/dist:/var/www/app/dist:ro
      - ./api:/var/www/api:ro
    restart: always

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: biblingo_api
    env_file:
      - ./api/.env
    volumes:
      - ./api:/var/www/api
    restart: always
