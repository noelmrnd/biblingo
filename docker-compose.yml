services:
  libringo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    container_name: libringo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./api/.env
        required: false
    environment:
      - MAIN_DB_HOST=${MAIN_DB_HOST:-host.docker.internal}
    ports:
      - "8084:8084"  # API (PHP Backend)
    volumes:
      - ./api:/var/www/api
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: libringo_web
    # tini como PID 1: pnpm no reenvia SIGTERM al proceso hijo (astro), asi que
    # sin init docker espera el grace period completo (10s) antes de matarlo.
    init: true
    ports:
      - "8082:3000"  # Web (Landing Page) - Astro Dev Server con Hot Reload
    volumes:
      - ./web:/web
      - /web/node_modules
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: libringo_app
    # tini como PID 1: mismo motivo que en "web" (pnpm no reenvia SIGTERM a vite).
    init: true
    ports:
      - "8083:3000"  # Frontend Vue + Vite Dev Server con Hot Reload
      - "5173:3000"  # Puerto alternativo Vite
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8084/api
    restart: unless-stopped
