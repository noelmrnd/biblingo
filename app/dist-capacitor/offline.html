<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sin conexión</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      padding: 24px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
        color: #f2f2f2;
      }
    }

    .wrap {
      max-width: 320px;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      opacity: 0.6;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.7;
      margin: 0 0 24px;
    }

    button {
      appearance: none;
      border: none;
      background: #6C28FE;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="currentColor"/>
      <path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2c-3.87-3.87-10.14-3.87-14 0z" fill="currentColor"/>
      <path d="M9 17l3 3 3-3c-1.66-1.66-4.34-1.66-6 0z" fill="currentColor"/>
      <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>
    </svg>
    <h1>Sin conexión a internet</h1>
    <p>No pudimos cargar Biblingo. Revisa tu conexión e intenta de nuevo.</p>
    <button id="retry">Reintentar</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      window.location.href = 'https://app.biblingo.me';
    });
  </script>
</body>
</html>
