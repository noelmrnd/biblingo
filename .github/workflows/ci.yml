name: CI/CD Pipeline & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish All-in-One Docker Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Configurar Node.js con Cache
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Instalar dependencias del Frontend
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Compilar Frontend Vue.js
        run: pnpm build
        working-directory: app

      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraer etiquetas de versión
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Construir y publicar paquete Docker (All-in-One: Web, App, API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
